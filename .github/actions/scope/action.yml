name: Select browser-backed suites
description: Run a suite when this event wants it and no pass marker for its exact input hash exists (forced runs ignore markers)
outputs:
  e2e_shards:
    description: JSON array of the end-to-end shard numbers that run
    value: ${{ steps.select.outputs.e2e_shards }}
  browser:
    description: Whether the recorder, render, plugin, distribution and Agent-Native suite runs
    value: ${{ steps.select.outputs.browser }}
  docker:
    description: Whether the Docker build and health check run
    value: ${{ steps.select.outputs.docker }}
  key_e2e_1:
    description: Pass marker cache key for end-to-end shard 1
    value: ${{ steps.keys.outputs.e2e-1 }}
  key_e2e_2:
    description: Pass marker cache key for end-to-end shard 2
    value: ${{ steps.keys.outputs.e2e-2 }}
  key_e2e_3:
    description: Pass marker cache key for end-to-end shard 3
    value: ${{ steps.keys.outputs.e2e-3 }}
  key_browser:
    description: Pass marker cache key for the browser suite
    value: ${{ steps.keys.outputs.browser }}
  key_docker:
    description: Pass marker cache key for the Docker suite
    value: ${{ steps.keys.outputs.docker }}
runs:
  using: composite
  steps:
    - id: keys
      shell: bash
      env:
        CI_EVENT: ${{ github.event_name }}
        CI_SCHEDULE: ${{ github.event.schedule }}
        CI_BASE: ${{ github.event.pull_request.base.sha }}
        CI_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        NODE_VERSION: ${{ env.NODE_VERSION }}
      run: node scripts/ci-scope.mjs
    - id: e2e-1
      if: steps.keys.outputs.wanted == 'true' && steps.keys.outputs.force != 'true'
      uses: actions/cache/restore@v4
      with:
        path: .ci-pass
        key: ${{ steps.keys.outputs.e2e-1 }}
        lookup-only: true
    - id: e2e-2
      if: steps.keys.outputs.wanted == 'true' && steps.keys.outputs.force != 'true'
      uses: actions/cache/restore@v4
      with:
        path: .ci-pass
        key: ${{ steps.keys.outputs.e2e-2 }}
        lookup-only: true
    - id: e2e-3
      if: steps.keys.outputs.wanted == 'true' && steps.keys.outputs.force != 'true'
      uses: actions/cache/restore@v4
      with:
        path: .ci-pass
        key: ${{ steps.keys.outputs.e2e-3 }}
        lookup-only: true
    - id: browser
      if: steps.keys.outputs.wanted == 'true' && steps.keys.outputs.force != 'true'
      uses: actions/cache/restore@v4
      with:
        path: .ci-pass
        key: ${{ steps.keys.outputs.browser }}
        lookup-only: true
    - id: docker
      if: steps.keys.outputs.wanted == 'true' && steps.keys.outputs.force != 'true'
      uses: actions/cache/restore@v4
      with:
        path: .ci-pass
        key: ${{ steps.keys.outputs.docker }}
        lookup-only: true
    - id: select
      shell: bash
      env:
        WANTED: ${{ steps.keys.outputs.wanted }}
        FORCE: ${{ steps.keys.outputs.force }}
        HIT_E2E_1: ${{ steps.e2e-1.outputs.cache-hit }}
        HIT_E2E_2: ${{ steps.e2e-2.outputs.cache-hit }}
        HIT_E2E_3: ${{ steps.e2e-3.outputs.cache-hit }}
        HIT_BROWSER: ${{ steps.browser.outputs.cache-hit }}
        HIT_DOCKER: ${{ steps.docker.outputs.cache-hit }}
      run: |
        # invariant: a wanted suite reruns unless an exact key hit exists; a forced run, a miss or a lookup error runs it.
        runs() { [ "$WANTED" = true ] && { [ "$FORCE" = true ] || [ "$1" != true ]; }; }
        report() {
          if runs "$2"; then echo "- $1: runs" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$WANTED" != true ]; then echo "- $1: not needed for this pull request" >> "$GITHUB_STEP_SUMMARY"
          else echo "- $1: reused: identical inputs passed in an earlier run" >> "$GITHUB_STEP_SUMMARY"; fi
        }
        flag() { if runs "$1"; then echo true; else echo false; fi; }
        shards=()
        for shard in 1 2 3; do
          hit="HIT_E2E_$shard"
          if runs "${!hit}"; then shards+=("$shard"); fi
        done
        {
          echo "browser=$(flag "$HIT_BROWSER")"
          echo "docker=$(flag "$HIT_DOCKER")"
          echo "e2e_shards=[$(IFS=,; echo "${shards[*]}")]"
        } >> "$GITHUB_OUTPUT"
        echo '### Suites' >> "$GITHUB_STEP_SUMMARY"
        report 'End-to-end (1/3)' "$HIT_E2E_1"
        report 'End-to-end (2/3)' "$HIT_E2E_2"
        report 'End-to-end (3/3) and single-page app' "$HIT_E2E_3"
        report 'Recorder, render, plugins, distribution and Agent-Native' "$HIT_BROWSER"
        report 'Docker build (not pushed)' "$HIT_DOCKER"
