name: Select affected checks
description: Skip runtime checks only for documentation or Storybook-only pull requests
outputs:
  runtime:
    value: ${{ steps.scope.outputs.runtime }}
  storybook:
    value: ${{ steps.scope.outputs.storybook }}
runs:
  using: composite
  steps:
    - id: scope
      shell: bash
      env:
        CI_EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
      run: node scripts/ci-scope.mjs
