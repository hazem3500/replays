name: Runtime performance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Runtime performance (report-only)
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    outputs:
      performanceReport: ${{ steps.summary.outputs.markdownBase64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node --test scripts/perf/model.test.mjs
      # Build main independently with its own lockfile. Only the measurement code comes from the PR.
      # Never use pull_request_target or execute PR code with a write token.
      - name: Prepare current main baseline
        run: |
          git fetch origin main
          mkdir -p ../runtime-perf-main
          echo "PERF_MAIN_REVISION=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          git archive origin/main | tar -x -C ../runtime-perf-main
          mkdir -p ../runtime-perf-main/scripts/perf ../runtime-perf-main/budgets
          cp -R scripts/perf/. ../runtime-perf-main/scripts/perf/
          cp performance-budget.config.mjs ../runtime-perf-main/
          cp budgets/runtime.mjs ../runtime-perf-main/budgets/
          cd ../runtime-perf-main
          pnpm install --frozen-lockfile
          pnpm build
      - name: Measure main on this runner
        id: baseline
        continue-on-error: true
        run: |
          cd ../runtime-perf-main
          PERF_REVISION="$PERF_MAIN_REVISION" PERF_OUTPUT="$GITHUB_WORKSPACE/.review-artifacts/perf/main" node scripts/perf/run.mjs
        env:
          CHROMIUM_NO_SANDBOX: '1'
      - run: pnpm build
      - name: Measure candidate
        id: candidate
        run: node scripts/perf/run.mjs
        env:
          CHROMIUM_NO_SANDBOX: '1'
      - name: Summarize numbers and deltas
        id: summary
        if: always() && steps.candidate.outcome != 'skipped'
        run: node scripts/perf/report.mjs .review-artifacts/perf/current/results.json .review-artifacts/perf/main/results.json
      - if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: runtime-performance
          path: .review-artifacts/perf/
          retention-days: 14
          if-no-files-found: error

  # Trusted workflow code publishes the measured table; no checkout and no execution of PR code.
  # Fork PRs still get the table in the check summary and downloadable artifact.
  comment:
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.measure.outputs.performanceReport != ''
    needs: measure
    runs-on: ubicloud-standard-2
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          PERF_REPORT_BASE64: ${{ needs.measure.outputs.performanceReport }}
        with:
          script: |
            const body = Buffer.from(process.env.PERF_REPORT_BASE64, 'base64').toString('utf8');
            const marker = '<!-- replays-runtime-performance -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number,
            });
            const previous = comments.find(comment => comment.user.type === 'Bot' && comment.body.startsWith(marker));
            if (previous) await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
