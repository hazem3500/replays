name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Documentation-only changes start no run; scripts/ci-scope.mjs mirrors these exclusions per suite.
    paths:
      - '**'
      - '!*.md'
      - '!docs/**/*.md'
      - 'docs/tokens.md'
      - '!docs/screenshots/**'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/pull_request_template.md'
      - '!.github/CODEOWNERS'
      - '!LICENSE'
  push:
    branches: [main]
    paths:
      - '**'
      - '!*.md'
      - '!docs/**/*.md'
      - 'docs/tokens.md'
      - '!docs/screenshots/**'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/pull_request_template.md'
      - '!.github/CODEOWNERS'
      - '!LICENSE'
  # Weekly drift check on unchanged main (dependencies, browsers, runner image).
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.4

jobs:
  # Each suite is skipped when a pass marker for its exact input hash exists; scheduled and manual runs run everything.
  scope:
    name: Affected checks
    # Draft pull requests run nothing; every other job needs this one.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.scope.outputs.checks }}
      e2e_shards: ${{ steps.scope.outputs.e2e_shards }}
      browser: ${{ steps.scope.outputs.browser }}
      docker: ${{ steps.scope.outputs.docker }}
      key_checks: ${{ steps.scope.outputs.key_checks }}
      key_e2e_1: ${{ steps.scope.outputs.key_e2e_1 }}
      key_e2e_2: ${{ steps.scope.outputs.key_e2e_2 }}
      key_e2e_3: ${{ steps.scope.outputs.key_e2e_3 }}
      key_browser: ${{ steps.scope.outputs.key_browser }}
      key_docker: ${{ steps.scope.outputs.key_docker }}
    steps:
      - uses: actions/checkout@v4
      - id: scope
        uses: ./.github/actions/scope
      - run: node --test scripts/ci-scope.test.mjs

  # One install for every static check, unit suite and build. Each check still runs when an earlier one fails.
  checks:
    name: Lint, types, unit tests and build
    needs: scope
    if: needs.scope.outputs.checks == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: replays-test-only
          POSTGRES_DB: replays_architecture
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/task-cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          namespace: ci-checks
      - name: Report pinned Vite+ toolchain
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec vp --version
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check
      # why: types and unit tests run before any build output exists, as they did in their own jobs.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck:storybook
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
        env:
          # The capture test drives a real Chrome (preinstalled on the runner image).
          CHROME_PATH: /usr/bin/google-chrome
          CHROMIUM_NO_SANDBOX: '1'
      - name: PostgreSQL tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec vp test run --config vitest.config.ts test/agent-native-runtime.test.ts test/agent-native-postgres.test.ts --maxWorkers=1
        env:
          REPLAYS_TEST_DATABASE_URL: postgresql://postgres:replays-test-only@127.0.0.1:55432/replays_architecture
      # Lint debt ratchet: existing violations are baselined, added files must meet the final rules.
      - id: build-cli
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build:cli
      - if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
        run: pnpm lint:ratchet:test
      - if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
        run: pnpm lint:ratchet
      - if: ${{ !cancelled() && steps.build-cli.outcome == 'success' }}
        run: pnpm typecheck:overrides
      - name: Final rules for added files
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.build-cli.outcome == 'success' }}
        env:
          LINT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm lint:new-files
      - name: Retain full lint diagnostics in logs
        if: always()
        run: |
          for report in .review-artifacts/code-quality/lint-*.json; do
            [ -f "$report" ] || continue
            cat "$report"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: lint-reports
          path: .review-artifacts/code-quality/lint-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Viewer and library build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
      - name: Host application example
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.build-cli.outcome == 'success' }}
        run: pnpm --filter @hazem3500/replays-example-host-app check
      - if: success()
        uses: ./.github/actions/remember-pass
        with:
          key: ${{ needs.scope.outputs.key_checks }}

  e2e:
    name: End-to-end (${{ matrix.shard }}/3)
    needs: scope
    if: needs.scope.outputs.e2e_shards != '[]'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.e2e_shards) }}
    runs-on: ubicloud-standard-2
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/task-cache
        with:
          namespace: ci-e2e-shards-${{ matrix.shard }}
      # why: the runner's package index usually resolves FFmpeg already; refresh it only when that install fails.
      - name: Install FFmpeg for encoded export coverage
        run: >-
          sudo apt-get install --no-install-recommends -y ffmpeg
          || { sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg; }
      - id: browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/browser
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3
        env:
          # GitHub's Ubuntu runners block unprivileged user namespaces, so Chromium's own sandbox cannot start
          # there. Server-side rendering runs it with --no-sandbox, like the Docker image does.
          CHROMIUM_NO_SANDBOX: '1'
      # why: uploaded before the single-page run, which would replace this shard's report and results.
      - if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
          compression-level: 0
      # why: the stamped index.html the server falls back to (REPLAYS_SSR=0, and replays build-static): navigation, base paths, hosts, sign-in.
      - name: End-to-end (single-page app)
        id: spa
        if: ${{ !cancelled() && matrix.shard == 3 && steps.install.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: >-
          pnpm test:e2e e2e/smoke.spec.ts e2e/navigation.spec.ts e2e/skeleton.spec.ts e2e/branding-and-base-path.spec.ts
          e2e/hosts-and-static.spec.ts e2e/sign-in.spec.ts e2e/settings-mobile.spec.ts e2e/suite-workspace.spec.ts
        env:
          REPLAYS_SSR: '0'
          CHROMIUM_NO_SANDBOX: '1'
      - if: ${{ failure() && steps.spa.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report-single-page-app
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
          compression-level: 0
      - if: success()
        uses: ./.github/actions/remember-pass
        with:
          key: ${{ matrix.shard == 1 && needs.scope.outputs.key_e2e_1 || matrix.shard == 2 && needs.scope.outputs.key_e2e_2 || needs.scope.outputs.key_e2e_3 }}

  # One install and one viewer/package build shared by the browser-backed suites. Independent groups still report.
  browser:
    name: Recorder, render, plugins, distribution and Agent-Native
    needs: scope
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/task-cache
        with:
          namespace: ci-browser
      - name: Install FFmpeg for the real render
        id: ffmpeg
        run: >-
          sudo apt-get install --no-install-recommends -y ffmpeg
          || { sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg; }
      - id: browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/browser
      - name: Browser recorder (happy-dom)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:recorder
      # The viewer and the library entries (what package.json `exports` points at), then the examples on top of them.
      - name: Viewer and library build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
      - name: Package build
        id: build-cli
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build:cli
      - name: Real render (Chromium and FFmpeg) and isolated plugin check (Chromium)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.ffmpeg.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: pnpm exec vp test run --config vitest.config.ts --maxWorkers=1 test/render.integration.test.ts test/plugin-check-browser.test.ts
        env:
          REPLAYS_PLUGIN_BROWSER_TESTS: '1'
          CHROMIUM_NO_SANDBOX: '1'
      - name: The packed tarball works when installed outside the repository
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.build-cli.outcome == 'success' }}
        run: pnpm test:pack
      - id: distro-build
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.build-cli.outcome == 'success' }}
        run: pnpm --filter @hazem3500/replays-example-custom-distro build
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.build-cli.outcome == 'success' }}
        run: pnpm --filter @hazem3500/replays-example-custom-distro typecheck
      - name: Standalone playback and React composition consumer
        id: composed-check
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.build-cli.outcome == 'success' }}
        run: pnpm --filter @hazem3500/replays-example-composed-viewer check
      - name: Independent playback lifecycle and custom React controls
        if: ${{ !cancelled() && steps.composed-check.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: pnpm exec playwright test -c examples/composed-viewer/playwright.config.ts
        env:
          CHROMIUM_NO_SANDBOX: '1'
      - name: Extensions are active (auth, context, branding, tab, action, panel, hooks)
        if: ${{ !cancelled() && steps.distro-build.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: pnpm exec playwright test -c examples/custom-distro/playwright.config.ts
        env:
          CHROMIUM_NO_SANDBOX: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: distro-playwright-report
          path: |
            examples/custom-distro/playwright-report/
            examples/custom-distro/test-results/
            examples/composed-viewer/playwright-report/
            examples/composed-viewer/test-results/
          retention-days: 3
          if-no-files-found: ignore
          compression-level: 0
      - id: agent-native
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.build-cli.outcome == 'success' }}
        run: pnpm --filter @hazem3500/replays-example-agent-native check
      - id: storybook
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build:storybook
      - name: Native WebMCP, stand-in, framework consumer and inert component stories
        if: ${{ !cancelled() && steps.agent-native.outcome == 'success' && steps.storybook.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: pnpm --filter @hazem3500/replays-example-agent-native test --max-failures=1
        env:
          CHROMIUM_NO_SANDBOX: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: agent-integration-results
          path: examples/agent-native/test-results/
          retention-days: 3
          if-no-files-found: ignore
          compression-level: 0
      - if: success()
        uses: ./.github/actions/remember-pass
        with:
          key: ${{ needs.scope.outputs.key_browser }}

  docker:
    needs: scope
    if: needs.scope.outputs.docker == 'true'
    name: Docker build (not pushed)
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/hazem3500/replays:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Container answers the health check
        run: |
          docker run -d --name rk -p 8080:8080 ghcr.io/hazem3500/replays:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs rk
          exit 1
      - if: success()
        uses: ./.github/actions/remember-pass
        with:
          key: ${{ needs.scope.outputs.key_docker }}
