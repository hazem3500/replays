name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22.23.4

jobs:
  lint:
    name: Lint and format
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: Unit tests and build
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          # The capture test drives a real Chrome (preinstalled on the runner image).
          CHROME_PATH: /usr/bin/google-chrome
          CHROMIUM_NO_SANDBOX: '1'
      - run: pnpm build
      - run: pnpm build:cli
      - name: Host application example
        run: pnpm --filter @hazem3500/replays-example-host-app check

  e2e:
    name: End-to-end smoke
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          # GitHub's Ubuntu runners block unprivileged user namespaces, so Chromium's own sandbox cannot start
          # there. Server-side rendering runs it with --no-sandbox, like the Docker image does.
          CHROMIUM_NO_SANDBOX: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  distro:
    name: Custom distribution example
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The viewer and the library entries (what package.json `exports` points at), then the example on top of them.
      - run: pnpm build
      - run: pnpm build:cli
      - name: The packed tarball works when installed outside the repository
        run: pnpm test:pack
      - run: pnpm --filter @hazem3500/replays-example-custom-distro build
      - run: pnpm --filter @hazem3500/replays-example-custom-distro typecheck
      - name: Extensions are active (auth, context, branding, tab, action, panel, hooks)
        run: pnpm exec playwright test -c examples/custom-distro/playwright.config.ts
        env:
          CHROMIUM_NO_SANDBOX: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: distro-playwright-report
          path: |
            examples/custom-distro/playwright-report/
            examples/custom-distro/test-results/
          retention-days: 7

  docker:
    name: Docker build (not pushed)
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/hazem3500/replays:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Container answers the health check
        run: |
          docker run -d --name rk -p 8080:8080 ghcr.io/hazem3500/replays:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs rk
          exit 1
