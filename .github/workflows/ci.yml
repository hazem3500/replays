name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22.23.4

jobs:
  scope:
    name: Affected checks
    runs-on: ubicloud-standard-2
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      storybook: ${{ steps.scope.outputs.storybook }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/scope
      - run: node --test scripts/ci-scope.test.mjs

  lint:
    name: Lint and format
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Report pinned Vite+ toolchain
        run: pnpm exec vp --version
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm typecheck
      - run: pnpm typecheck:storybook

  unit-tests:
    name: Unit tests
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm test
        env:
          # The capture test drives a real Chrome (preinstalled on the runner image).
          CHROME_PATH: /usr/bin/google-chrome
          CHROMIUM_NO_SANDBOX: '1'

  build:
    name: Viewer, library and host application
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/task-cache
        with:
          namespace: ci-build
      - run: pnpm build
      - run: pnpm build:cli
      - name: Host application example
        run: pnpm --filter @hazem3500/replays-example-host-app check

  e2e-shards:
    name: End-to-end (${{ matrix.shard }}/3)
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/task-cache
        with:
          namespace: ci-e2e-shards-${{ matrix.shard }}
      - name: Install FFmpeg for encoded export coverage
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - uses: ./.github/actions/browser
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3
        env:
          # GitHub's Ubuntu runners block unprivileged user namespaces, so Chromium's own sandbox cannot start
          # there. Server-side rendering runs it with --no-sandbox, like the Docker image does.
          CHROMIUM_NO_SANDBOX: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
          compression-level: 0
  e2e-ssr:
    name: End-to-end (single-page app)
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/task-cache
        with:
          namespace: ci-e2e-spa
      - uses: ./.github/actions/browser
      # why: the stamped index.html the server falls back to (REPLAYS_SSR=0, and replays build-static): navigation, base paths, hosts, sign-in.
      - run: >-
          pnpm test:e2e e2e/smoke.spec.ts e2e/navigation.spec.ts e2e/skeleton.spec.ts e2e/branding-and-base-path.spec.ts
          e2e/hosts-and-static.spec.ts e2e/sign-in.spec.ts e2e/settings-mobile.spec.ts e2e/suite-workspace.spec.ts
        env:
          REPLAYS_SSR: '0'
          CHROMIUM_NO_SANDBOX: '1'
  integration:
    name: Recorder, render and plugin browser tests
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/task-cache
        with:
          namespace: ci-integration
      - name: Install FFmpeg for the real render
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - uses: ./.github/actions/browser
      - name: Browser recorder (happy-dom)
        run: pnpm test:recorder
      - run: pnpm build
      - name: Real render (Chromium and FFmpeg) and isolated plugin check (Chromium)
        run: pnpm exec vp test run --config vitest.config.ts --maxWorkers=1 test/render.integration.test.ts test/plugin-check-browser.test.ts
        env:
          REPLAYS_PLUGIN_BROWSER_TESTS: '1'
          CHROMIUM_NO_SANDBOX: '1'
  distro:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: Custom distribution example
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/task-cache
        with:
          namespace: ci-distro
      - uses: ./.github/actions/browser
      # The viewer and the library entries (what package.json `exports` points at), then the example on top of them.
      - run: pnpm build
      - run: pnpm build:cli
      - name: The packed tarball works when installed outside the repository
        run: pnpm test:pack
      - run: pnpm --filter @hazem3500/replays-example-custom-distro build
      - run: pnpm --filter @hazem3500/replays-example-custom-distro typecheck
      - name: Standalone playback and React composition consumer
        run: pnpm --filter @hazem3500/replays-example-composed-viewer check
      - name: Independent playback lifecycle and custom React controls
        run: pnpm exec playwright test -c examples/composed-viewer/playwright.config.ts
        env:
          CHROMIUM_NO_SANDBOX: '1'
      - name: Extensions are active (auth, context, branding, tab, action, panel, hooks)
        run: pnpm exec playwright test -c examples/custom-distro/playwright.config.ts
        env:
          CHROMIUM_NO_SANDBOX: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: distro-playwright-report
          path: |
            examples/custom-distro/playwright-report/
            examples/custom-distro/test-results/
            examples/composed-viewer/test-results/
          retention-days: 3
          if-no-files-found: ignore
          compression-level: 0
  agent-integrations:
    needs: scope
    if: needs.scope.outputs.storybook == 'true'
    name: Agent-Native and Storybook
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/task-cache
        with:
          namespace: ci-agent-integrations
      - uses: ./.github/actions/browser
      - run: pnpm build
      - run: pnpm build:cli
      - run: pnpm --filter @hazem3500/replays-example-agent-native check
      - run: pnpm build:storybook
      - name: Native WebMCP, stand-in, framework consumer and inert component stories
        run: pnpm --filter @hazem3500/replays-example-agent-native test --max-failures=1
        env:
          CHROMIUM_NO_SANDBOX: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: agent-integration-results
          path: examples/agent-native/test-results/
          retention-days: 3
          if-no-files-found: ignore
          compression-level: 0
  docker:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: Docker build (not pushed)
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/hazem3500/replays:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Container answers the health check
        run: |
          docker run -d --name rk -p 8080:8080 ghcr.io/hazem3500/replays:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs rk
          exit 1

  unit:
    name: Unit tests and build
    if: always()
    needs: [scope, unit-tests, build]
    runs-on: ubicloud-standard-2
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          REQUIRED: ${{ needs.scope.outputs.runtime }}
          TESTS: ${{ needs.unit-tests.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          test "$SCOPE" = success
          if [ "$REQUIRED" = true ]; then
            test "$TESTS" = success && test "$BUILD" = success
          else
            test "$TESTS" = skipped && test "$BUILD" = skipped
          fi

  e2e:
    name: End-to-end smoke
    if: always()
    needs: [scope, lint, typecheck, unit-tests, build, e2e-shards, e2e-ssr, integration, distro, agent-integrations, docker]
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/github-script@v7
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const jobs = JSON.parse(process.env.RESULTS);
            const runtime = jobs.scope.outputs.runtime === 'true';
            const storybook = jobs.scope.outputs.storybook === 'true';
            for (const [name, job] of Object.entries(jobs)) {
              const runtimeJob = ['unit-tests', 'build', 'e2e-shards', 'e2e-ssr', 'integration', 'distro', 'docker'].includes(name);
              const maySkip = (!runtime && runtimeJob) || (!storybook && name === 'agent-integrations');
              if (job.result !== (maySkip ? 'skipped' : 'success')) core.setFailed(`${name}: ${job.result}`);
            }
