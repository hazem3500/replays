name: CI

on:
  pull_request:
    # `labeled` only matters for `run-e2e`; other labels start a run whose jobs all skip.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    # Documentation-only changes start no run; scripts/ci-scope.mjs mirrors these exclusions per suite.
    paths:
      - '**'
      - '!*.md'
      - '!docs/**/*.md'
      - 'docs/tokens.md'
      - '!docs/screenshots/**'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/pull_request_template.md'
      - '!.github/CODEOWNERS'
      - '!LICENSE'
  push:
    branches: [main]
    paths:
      - '**'
      - '!*.md'
      - '!docs/**/*.md'
      - 'docs/tokens.md'
      - '!docs/screenshots/**'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/pull_request_template.md'
      - '!.github/CODEOWNERS'
      - '!LICENSE'
  schedule:
    # Weekly drift check (dependencies, browsers, runner image): every suite runs, earlier passes are not reused.
    - cron: '23 3 * * 1'
    # Nightly: the browser-backed suites run for any main state that has no pass yet (e.g. a cancelled main run).
    - cron: '23 3 * * 0,2-6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # why: an unrelated label gets its own group, so labelling never cancels a run in progress.
  group: >-
    ci-${{ github.event.pull_request.number || github.ref }}${{
    github.event.action == 'labeled' && github.event.label.name != 'run-e2e' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.4

jobs:
  # The pull request gate: lint, format, types, unit tests, builds and the quality audits as Turborepo tasks. Pull
  # requests run only the tasks whose inputs changed against the base (`--affected`), and every task replays from the
  # shared remote cache when the same inputs already passed on any branch. It also picks the browser-backed suites.
  gate:
    name: Gate
    # Draft pull requests run nothing; mark the pull request ready (`gh pr ready`) to run it.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'run-e2e'))
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    outputs:
      e2e_shards: ${{ steps.scope.outputs.e2e_shards }}
      browser: ${{ steps.scope.outputs.browser }}
      docker: ${{ steps.scope.outputs.docker }}
      key_e2e_1: ${{ steps.scope.outputs.key_e2e_1 }}
      key_e2e_2: ${{ steps.scope.outputs.key_e2e_2 }}
      key_e2e_3: ${{ steps.scope.outputs.key_e2e_3 }}
      key_browser: ${{ steps.scope.outputs.key_browser }}
      key_docker: ${{ steps.scope.outputs.key_docker }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TELEMETRY_DISABLED: '1'
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      # The capture test drives a real Chrome (preinstalled on the runner image).
      CHROME_PATH: /usr/bin/google-chrome
      CHROMIUM_NO_SANDBOX: '1'
      REPLAYS_TEST_DATABASE_URL: postgresql://postgres:replays-test-only@127.0.0.1:55432/replays_architecture
    steps:
      # why: a service container made every gate wait about 12 s for the image pull and health check before its first
      # step. Started in the background here, PostgreSQL boots while checkout and install run; only its tests wait.
      - name: Start PostgreSQL in the background
        run: >-
          nohup docker run -d --name postgres -p 55432:5432 -e POSTGRES_PASSWORD=replays-test-only
          -e POSTGRES_DB=replays_architecture postgres:17.6-alpine > "$RUNNER_TEMP/postgres.log" 2>&1 &
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: scope
        uses: ./.github/actions/scope
      # why: the suite selector's own tests only need to run when the selector or the workflows change.
      - name: Suite selector tests
        run: |
          if [ -z "$PR_BASE" ] || ! git diff --quiet "$PR_BASE" HEAD -- scripts/ci-scope.mjs scripts/ci-scope.test.mjs .github/; then
            node --test scripts/ci-scope.test.mjs
          fi
      - id: install
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Turborepo tasks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          BUNDLE_PR_URL: ${{ github.event.pull_request.html_url }}
          LINT_BASE_REF: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          tasks=(lint format:check typecheck typecheck:storybook build build:cli lint:ratchet lint:ratchet:test
            quality:knip quality:boundaries quality:dedupe quality:hooks quality:test quality:package)
          flags=(--summarize --continue)
          units=(test test:postgres)
          if [ -n "$PR_BASE" ]; then
            export SIZE_BASE_SHA="$PR_BASE"
            tasks+=(lint:new-files quality:size:ci)
            flags+=(--affected)
            # why: pull requests run only the unit tests whose module graph reaches a changed file (Vitest --changed);
            # main, nightly and the weekly run keep the full suite, and a red main opens the main-health issue.
            export TEST_CHANGED_SINCE="$PR_BASE"
            units=(test:affected test:postgres)
          else
            # why: main measures its own bundle sizes, so pull requests on this base replay them instead of building main.
            export SIZE_BASE_SHA="$GITHUB_SHA"
            tasks+=(quality:size:base)
          fi
          status=0
          pnpm exec turbo run "${tasks[@]}" "${flags[@]}" --concurrency=2 || status=1
          # invariant: TCP readiness, not the socket, so the image's init-only server never counts as up.
          for i in $(seq 1 60); do
            docker exec postgres pg_isready -h 127.0.0.1 -U postgres -q 2>/dev/null && break
            [ "$i" = 60 ] && { cat "$RUNNER_TEMP/postgres.log"; docker logs postgres; echo '::error::PostgreSQL did not start'; status=1; }
            sleep 1
          done
          # why: the unit suites have 5 second timeouts tuned for a quiet runner; sharing two cores with builds timed them out.
          pnpm exec turbo run "${units[@]}" "${flags[@]}" --concurrency=1 || status=1
          if [ -n "$PR_BASE" ]; then
            # why: the example packages' own tests; turbo replays them unless their inputs changed.
            pnpm exec turbo run test --filter='./examples/*' --summarize --continue --concurrency=1 || status=1
          fi
          exit "$status"
      - name: Turborepo summary and full reports
        if: always()
        run: |
          for summary in .turbo/runs/*.json; do
            [ -f "$summary" ] || continue
            jq -r '"Turborepo: \(.execution.attempted) tasks, \(.execution.cached) cached, \(.execution.failed) failed, \(.execution.endTime - .execution.startTime) ms"' "$summary" | tee -a "$GITHUB_STEP_SUMMARY"
            jq -r '.tasks[] | "\(.taskId)\t\(.cache.status)\t\(.execution.exitCode // "-")\t\((.execution.endTime // 0) - (.execution.startTime // 0)) ms"' "$summary"
          done
          # why: raw lint JSON runs to hundreds of thousands of lines; it stays in the gate-reports artifact.
          for report in .review-artifacts/quality/*; do
            [ -f "$report" ] || continue
            printf '\nReport: %s\n' "$report"
            cat "$report"
          done
      - uses: actions/upload-artifact@v4
        # why: a green gate's summary is already in the log above; the upload cost every passing run about 4 s.
        if: failure()
        # Storage quota must not turn a passing gate into a failed check; the logs above retain the evidence.
        continue-on-error: true
        with:
          name: gate-reports
          path: |
            .turbo/runs/
            .review-artifacts/code-quality/lint-*.json
            .review-artifacts/quality/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

  # The browser-backed suites below run on main, nightly, with the `run-e2e` label, and on pull requests that touch
  # the risky paths listed (with reasons) in scripts/ci-scope.mjs; a suite whose exact inputs already passed is reused.
  e2e:
    name: End-to-end (${{ matrix.shard }}/3)
    needs: gate
    # why: still runs when the gate fails, so a broken main shows every failing suite at once.
    if: ${{ !cancelled() && needs.gate.outputs.e2e_shards != '' && needs.gate.outputs.e2e_shards != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.gate.outputs.e2e_shards) }}
    runs-on: ubicloud-standard-2
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/task-cache
        with:
          namespace: ci-e2e-shards-${{ matrix.shard }}
      # why: the runner's package index usually resolves FFmpeg already; refresh it only when that install fails.
      - name: Install FFmpeg for encoded export coverage
        run: >-
          sudo apt-get install --no-install-recommends -y ffmpeg
          || { sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg; }
      - id: browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/browser
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3
        env:
          # GitHub's Ubuntu runners block unprivileged user namespaces, so Chromium's own sandbox cannot start
          # there. Server-side rendering runs it with --no-sandbox, like the Docker image does.
          CHROMIUM_NO_SANDBOX: '1'
      # why: uploaded before the single-page run, which would replace this shard's report and results.
      - if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
          compression-level: 0
      # why: the stamped index.html the server falls back to (REPLAYS_SSR=0, and replays build-static): navigation, base paths, hosts, sign-in.
      - name: End-to-end (single-page app)
        id: spa
        if: ${{ !cancelled() && matrix.shard == 3 && steps.install.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: >-
          pnpm test:e2e e2e/smoke.spec.ts e2e/navigation.spec.ts e2e/skeleton.spec.ts e2e/branding-and-base-path.spec.ts
          e2e/hosts-and-static.spec.ts e2e/sign-in.spec.ts e2e/settings-mobile.spec.ts e2e/suite-workspace.spec.ts
        env:
          REPLAYS_SSR: '0'
          CHROMIUM_NO_SANDBOX: '1'
      - if: ${{ failure() && steps.spa.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report-single-page-app
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
          compression-level: 0
      - if: success()
        uses: ./.github/actions/remember-pass
        with:
          key: ${{ matrix.shard == 1 && needs.gate.outputs.key_e2e_1 || matrix.shard == 2 && needs.gate.outputs.key_e2e_2 || needs.gate.outputs.key_e2e_3 }}

  # One install and one viewer/package build shared by the browser-backed suites. Independent groups still report.
  browser:
    name: Recorder, render, plugins, distribution and Agent-Native
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.browser == 'true' }}
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/task-cache
        with:
          namespace: ci-browser
      - name: Install FFmpeg for the real render
        id: ffmpeg
        run: >-
          sudo apt-get install --no-install-recommends -y ffmpeg
          || { sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg; }
      - id: browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/browser
      - name: Browser recorder (happy-dom)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:recorder
      # The viewer and the library entries (what package.json `exports` points at), then the examples on top of them.
      - name: Viewer and library build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
      - name: Package build
        id: build-cli
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build:cli
      - name: Real render (Chromium and FFmpeg) and isolated plugin check (Chromium)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.ffmpeg.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: pnpm exec vp test run --config vitest.config.ts --maxWorkers=1 test/render.integration.test.ts test/plugin-check-browser.test.ts
        env:
          REPLAYS_PLUGIN_BROWSER_TESTS: '1'
          CHROMIUM_NO_SANDBOX: '1'
      - name: The packed tarball works when installed outside the repository
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.build-cli.outcome == 'success' }}
        run: pnpm test:pack
      - id: distro-build
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.build-cli.outcome == 'success' }}
        run: pnpm --filter @hazem3500/replays-example-custom-distro build
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.build-cli.outcome == 'success' }}
        run: pnpm --filter @hazem3500/replays-example-custom-distro typecheck
      - name: Standalone playback and React composition consumer
        id: composed-check
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.build-cli.outcome == 'success' }}
        run: pnpm --filter @hazem3500/replays-example-composed-viewer check
      - name: Independent playback lifecycle and custom React controls
        if: ${{ !cancelled() && steps.composed-check.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: pnpm exec playwright test -c examples/composed-viewer/playwright.config.ts
        env:
          CHROMIUM_NO_SANDBOX: '1'
      - name: Extensions are active (auth, context, branding, tab, action, panel, hooks)
        if: ${{ !cancelled() && steps.distro-build.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: pnpm exec playwright test -c examples/custom-distro/playwright.config.ts
        env:
          CHROMIUM_NO_SANDBOX: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: distro-playwright-report
          path: |
            examples/custom-distro/playwright-report/
            examples/custom-distro/test-results/
            examples/composed-viewer/playwright-report/
            examples/composed-viewer/test-results/
          retention-days: 3
          if-no-files-found: ignore
          compression-level: 0
      - id: agent-native
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.build-cli.outcome == 'success' }}
        run: pnpm --filter @hazem3500/replays-example-agent-native check
      - id: storybook
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build:storybook
      - name: Native WebMCP, stand-in, framework consumer and inert component stories
        if: ${{ !cancelled() && steps.agent-native.outcome == 'success' && steps.storybook.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: pnpm --filter @hazem3500/replays-example-agent-native test:browser --max-failures=1
        env:
          CHROMIUM_NO_SANDBOX: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: agent-integration-results
          path: examples/agent-native/test-results/
          retention-days: 3
          if-no-files-found: ignore
          compression-level: 0
      - if: success()
        uses: ./.github/actions/remember-pass
        with:
          key: ${{ needs.gate.outputs.key_browser }}

  docker:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.docker == 'true' }}
    name: Docker build (not pushed)
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/hazem3500/replays:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Container answers the health check
        run: |
          docker run -d --name rk -p 8080:8080 ghcr.io/hazem3500/replays:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs rk
          exit 1
      - if: success()
        uses: ./.github/actions/remember-pass
        with:
          key: ${{ needs.gate.outputs.key_docker }}

  # A failing main is loud: the run is red and one tracking issue gets a comment per failing run; green closes it.
  main-health:
    name: Main health
    needs: [gate, e2e, browser, docker]
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          title='CI is failing on main'
          failed="$(jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")' <<<"$RESULTS")"
          issue="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$failed" ]; then
            body="$(printf 'Failing jobs: %s\nCommit: %s (%s run)\nRun: %s' "$failed" "$GITHUB_SHA" "$EVENT" "$RUN_URL")"
            if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"
            else gh issue create --title "$title" --body "$body"; fi
            echo "::error::Main is red: $failed. Tracking issue updated."
            exit 1
          fi
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "$(printf 'Green again at %s: %s' "$GITHUB_SHA" "$RUN_URL")"
          fi
