name: Application records

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: application-records-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubicloud-standard-2
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/scope

  postgres-tests:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: PostgreSQL tests
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: replays-test-only
          POSTGRES_DB: replays_architecture
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec vp test run --config vitest.config.ts test/agent-native-runtime.test.ts test/agent-native-postgres.test.ts --maxWorkers=1
        env:
          REPLAYS_TEST_DATABASE_URL: postgresql://postgres:replays-test-only@127.0.0.1:55432/replays_architecture

  postgres:
    name: PostgreSQL identity and credentials
    if: always()
    needs: [scope, postgres-tests]
    runs-on: ubicloud-standard-2
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          REQUIRED: ${{ needs.scope.outputs.runtime }}
          TESTS: ${{ needs.postgres-tests.result }}
        run: |
          test "$SCOPE" = success
          if [ "$REQUIRED" = true ]; then test "$TESTS" = success; else test "$TESTS" = skipped; fi
