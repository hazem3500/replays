name: Lint debt ratchet

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-ratchet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ratchet:
    name: Lint baseline and new files
    runs-on: ubicloud-standard-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cli
      - run: pnpm lint:ratchet:test
      - run: pnpm lint:ratchet
      - name: Final rules for added files
        if: github.event_name == 'pull_request'
        env:
          LINT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm lint:new-files
      - name: Retain full diagnostics in logs
        if: always()
        run: |
          for report in .review-artifacts/code-quality/lint-*.json; do
            [ -f "$report" ] || continue
            cat "$report"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: lint-reports
          path: .review-artifacts/code-quality/lint-*.json
          retention-days: 7
