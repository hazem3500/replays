# replays with an S3-compatible bucket (MinIO) instead of a local volume. Everything is built or pulled locally;
# nothing is published. Credentials below are throwaway development values: change them for anything real.
#
#   docker compose -f examples/s3-minio/docker-compose.yml up --build
#   open http://localhost:8080          (MinIO console: http://localhost:9001)
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: replays
      MINIO_ROOT_PASSWORD: replays-secret-change-me
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 replays replays-secret-change-me &&
                  mc mb --ignore-existing local/replays"

  replays:
    build:
      context: ../..
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AUTH_MODE: none
      STORAGE: s3
      S3_BUCKET: replays
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "1"
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: replays
      AWS_SECRET_ACCESS_KEY: replays-secret-change-me

volumes:
  minio:
